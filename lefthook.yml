pre-commit:
  parallel: false
  commands:
    biome:
      glob: "*.{js,jsx,ts,tsx,json}"
      run: |
        bun biome check --write --no-errors-on-unmatched {staged_files}

        status=$?

        if [ $status -ne 0 ]; then
          exit $status
        fi

        git add {staged_files}

commit-msg:
  commands:
    commitlint:
      run: bun commitlint --edit {1}

pre-push:
 commands:
   tests:
     run: bun test
   presentation-testes:
     run: bun run test -- --ci --passWithNoTests