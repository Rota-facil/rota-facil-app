pre-commit:
  parallel: false
  commands:
    biome:
      glob: "*.{js,jsx,ts,tsx,json}"
      run: |
        bun biome check --write --no-errors-on-unmatched {staged_files}

        status=$?

        if [ $status -ne 0 ]; then
          exit $status
        fi

        git add {staged_files}

commit-msg:
  commands:
    commitlint:
      run: bun commitlint --edit {1}

pre-push:
  parallel: false
  commands:
    checks:
      run: bun run lint && bun run typecheck
    tests:
      run: bun run test-full
